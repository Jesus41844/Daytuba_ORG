<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Daytuba Tasks</title>
    <link rel="icon" href="/icons/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f6fa;
        color: #1a1a24;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e5e6ef;
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 20px 45px -25px rgba(20, 20, 60, 0.35);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #55556b;
        font-size: 14px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #4f46b8;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 999px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161618;
          color: #f3f3f7;
        }
        .card {
          background: #202024;
          border-color: #2e2e34;
          box-shadow: none;
        }
        p {
          color: #a6a6b4;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon.svg" alt="Daytuba Tasks" />
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo
        de nuevo.
      </p>
      <a href="/dashboard">Reintentar</a>
    </main>
  </body>
</html>
