name: utp_org_prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-utp_tasks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-utp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-utp_tasks}
      UPLOADS_DIR: /app/uploads
      MOODLE_ENCRYPTION_KEY: ${MOODLE_ENCRYPTION_KEY:?Set MOODLE_ENCRYPTION_KEY in .env}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: busybox:1.36
    restart: unless-stopped
    depends_on:
      - web
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      REMINDERS_CRON_SCHEDULE: ${REMINDERS_CRON_SCHEDULE:-0 14 * * *}
      REMINDERS_URL: http://web:3000/api/cron/reminders
      MOODLE_SYNC_CRON_SCHEDULE: ${MOODLE_SYNC_CRON_SCHEDULE:-0 11 * * *}
      MOODLE_SYNC_URL: http://web:3000/api/cron/moodle-sync
    volumes:
      - ./scripts/cron-jobs.sh:/cron-jobs.sh:ro
    command: ["/bin/sh", "/cron-jobs.sh"]

volumes:
  pgdata:
  uploads:
