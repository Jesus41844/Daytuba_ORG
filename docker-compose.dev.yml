services:
  db:
    image: postgres:17-alpine
    container_name: utp-tasks-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utp}
      POSTGRES_DB: ${POSTGRES_DB:-utp_tasks}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - utp_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  utp_pgdata_dev:
